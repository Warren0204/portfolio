<!doctype html>
<!-- data-theme is dark here as the static fallback; the inline script below
     overrides it with a stored choice before first paint. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the shell paint into the notch and home-indicator
         areas; the header and tab bar re-inset themselves with env(). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- One value, matching the site's own default. Keying these to
         prefers-color-scheme tinted the browser chrome light for anyone on a
         light OS while the page itself opened dark. -->
    <meta name="theme-color" content="#0B1219" />

    <title>Warren Villagonzalo Gallardo · Power Platform Developer and Data Analyst</title>
    <meta
      name="description"
      content="Power Platform developer and data analyst in Cebu City. I put automation and reporting into live operations, then document and hand them over so they keep running."
    />
    <link rel="canonical" href="https://portfolio-beta-coral-24.vercel.app/" />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://portfolio-beta-coral-24.vercel.app/" />
    <meta property="og:site_name" content="Warren Villagonzalo Gallardo" />
    <meta property="og:title" content="Warren Villagonzalo Gallardo · Power Platform Developer and Data Analyst" />
    <meta
      property="og:description"
      content="Power Platform developer and data analyst in Cebu City. Automation and reporting shipped into live operations, documented, and handed over."
    />
    <!-- Regenerated from tools/og-card.html; see the comment at the top of that
         file. Absolute because Facebook, LinkedIn, and Slack all resolve
         og:image against nothing and will silently skip a relative path. -->
    <meta property="og:image" content="https://portfolio-beta-coral-24.vercel.app/assets/img/og/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Warren Villagonzalo Gallardo, Power Platform developer and data analyst, open to work in Cebu City."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Sora:wght@600;700&display=swap"
    />
    <link rel="preload" as="image" href="/assets/img/portrait.webp" fetchpriority="high" />
    <link rel="stylesheet" href="/css/main.css" />

    <link rel="icon" href="/assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Warren Villagonzalo Gallardo",
        "url": "https://portfolio-beta-coral-24.vercel.app/",
        "email": "mailto:warrengallardo0204@gmail.com",
        "telephone": "+63 968 725 6022",
        "jobTitle": "Power Platform Developer and Data Analyst",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cebu City",
          "addressCountry": "PH"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "University of Cebu, Banilad Campus"
        },
        "sameAs": ["https://github.com/Warren0204", "https://www.linkedin.com/in/warren-gallardo/"]
      }
    </script>

    <script>
      // Runs before first paint, so nobody sees the wrong theme flash past.
      // Module scripts are deferred, so main.js is too late to set this.
      // Mirrors readStoredTheme() in js/components/themeToggle.js and
      // STORAGE_KEYS.theme in js/core/constants.js: an explicit choice wins,
      // and until there is one the site opens dark. Change one, change both.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('nc-theme');
        } catch (error) {
          // Private-mode storage denial is not worth failing the page over.
        }

        document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
      })();

      // The intro is markup now, so a returning visitor would see it flash
      // before main.js could remove it. Decide before first paint instead.
      (function () {
        try {
          if (sessionStorage.getItem('nc-intro-v2')) {
            document.documentElement.classList.add('is-intro-seen');
          }
        } catch (error) {
          // Storage denied: showing the intro again is the harmless outcome.
        }
      })();
    </script>

    <!-- Without script the intro can never be dismissed, so it must not show. -->
    <noscript>
      <style>
        .preloader {
          display: none;
        }
      </style>
    </noscript>
  </head>

  <body>
    <!-- The loading screen is markup, not script, so it paints with the first
         byte instead of waiting for the module graph. It is the one piece of
         copy that lives in the shell: it has to exist before js/data/ has
         loaded, so this is its single source of truth. -->
    <div id="intro" class="preloader" aria-hidden="true">
      <span class="preloader__half preloader__half--top">
        <span class="preloader__mask"><span class="preloader__line">Welcome to</span></span>
      </span>
      <span class="preloader__half preloader__half--bottom">
        <span class="preloader__mask">
          <span class="preloader__line preloader__line--delayed">my portfolio.</span>
        </span>
        <div class="preloader__footer">
          <p class="preloader__signature">WARREN GALLARDO · CEBU CITY</p>
          <p class="preloader__count">0</p>
        </div>
        <div class="preloader__track"><div class="preloader__bar"></div></div>
      </span>
    </div>

    <a class="skip-link" href="#stage">Skip to content</a>
    <header id="site-header" class="header"></header>
    <main id="stage" class="stage"></main>

    <!-- GSAP, vendored in js/vendor/. Classic scripts, not modules: these are
         UMD builds, and a UMD wrapper loaded as a module throws on its own
         global-assignment fallback. js/vendor/README.md has the detail.
         Deferred classic scripts and module scripts run in one queue in
         document order, so these are ready before anything below imports them. -->
    <script defer src="/js/vendor/gsap.min.js"></script>
    <script defer src="/js/vendor/ScrollTrigger.min.js"></script>

    <!-- Loaded first and kept tiny, so the loading screen starts counting
         without waiting for the whole application graph. -->
    <script type="module" src="/js/intro.js"></script>
    <script type="module" src="/js/main.js"></script>

    <!-- Vercel Web Analytics. Page views and visitors only: no cookies, no
         cross-site identifier, and nothing that needs a consent banner.

         Both the queue shim and the script are Vercel's own, verbatim from
         their plain-HTML instructions. The queue exists so that a view fired
         before the deferred script arrives is replayed rather than dropped.

         The script is served from this origin under /_vercel/, which Vercel
         injects at deploy time — it does not exist in this repository and it
         404s on a local server. That is expected; tools/serve.ps1 answers it
         with a clean 404 so local development does not log a parse error.

         vercel.json must keep /_vercel/ out of its catch-all rewrite, or this
         request is answered with index.html and analytics silently records
         nothing. See DEPLOYMENT.md. -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
